<style>
    .app-container {
        display: grid;
        grid-template-columns: 240px 1fr 300px; /* Sidebar | Feed | Info */
        height: 100vh;
    }
    .sidebar { background: #2f3136; color: white; } /* Discord Dark */
    .feed { overflow-y: scroll; padding: 20px; background: #36393f; }
    .card { background: #fff; border-radius: 8px; margin-bottom: 20px; overflow: hidden; }
</style>

<div class="app-container">
    <div class="sidebar">
        {% for club in clubs %}
            <div class="club-icon">{{ club.name|slice:":1" }}</div>
        {% endfor %}
    </div>
    
    <div class="feed">
        {% for event in events %}
            <div class="card">
                <img src="{{ event.image }}" style="width:100%">
                <div class="p-3">
                    <h3>{{ event.title }}</h3>
                    <button onclick="bookTicket({{ event.id }})">Get Ticket</button>
                </div>
            </div>
        {% endfor %}
    </div>
</div>
