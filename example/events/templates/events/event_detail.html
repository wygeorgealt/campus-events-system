<!DOCTYPE html>
<html>
<head>
    <title>{{ event.title }} | Campus Events</title>
    <style>
        body { background: #36393f; color: white; font-family: sans-serif; display: flex; justify-content: center; padding: 40px; }
        .detail-card { background: #2f3136; border-radius: 12px; width: 600px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .detail-img { width: 100%; height: 350px; object-fit: cover; }
        .content { padding: 30px; }
        .title { font-size: 2rem; font-weight: bold; margin-bottom: 10px; }
        .desc { color: #b9bbbe; line-height: 1.6; margin-bottom: 30px; }
        .info-bar { display: flex; justify-content: space-between; background: #202225; padding: 15px; border-radius: 8px; margin-bottom: 30px; }
        .confirm-btn { background: #3ba55c; color: white; border: none; padding: 18px; width: 100%; border-radius: 6px; font-weight: bold; font-size: 1.1rem; cursor: pointer; }
        .confirm-btn:hover { background: #2d7d46; }
        .back-link { display: block; text-align: center; margin-top: 20px; color: #72767d; text-decoration: none; }
    </style>
</head>
<body>
    <div class="detail-card">
        {% if event.image %}
            <img src="{{ event.image.url }}" class="detail-img">
        {% endif %}
        
        <div class="content">
            <div class="title">{{ event.title }}</div>
            <p class="desc">{{ event.description }}</p>

            <div class="info-bar">
                <span>📍 Campus Main Hall</span>
                <span>👥 {{ event.signed_up_count }} / {{ event.capacity }} Joined</span>
            </div>

            {% if user.is_authenticated %}
                <form action="{% url 'register_event' event.id %}" method="POST">
                    {% csrf_token %}
                    <button type="submit" class="confirm-btn">Confirm Registration</button>
                </form>
            {% else %}
                <a href="{% url 'login' %}" class="confirm-btn" style="text-decoration: none; display: block; text-align: center;">Login to Sign Up</a>
            {% endif %}

            <a href="/" class="back-link">← Back to Feed</a>
        </div>
    </div>
</body>
</html>
