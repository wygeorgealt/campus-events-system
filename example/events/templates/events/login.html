<style>
    body { background: #36393f; color: white; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
    .auth-box { background: #2f3136; padding: 40px; border-radius: 8px; width: 320px; display: flex; flex-direction: column; }
    input { background: #202225; border: none; padding: 12px; margin-bottom: 15px; border-radius: 4px; color: white; width: 100%; box-sizing: border-box; }
    button { background: #5865f2; color: white; border: none; padding: 12px; border-radius: 4px; font-weight: bold; cursor: pointer; }
</style>

<div class="auth-box">
    <h2 style="text-align: center;">Welcome Back</h2>
    <form method="POST">
        {% csrf_token %}
        <input type="text" name="username" placeholder="Username" required>
        <input type="password" name="password" placeholder="Password" required>
        <button type="submit">Login</button>
    </form>
    <p style="font-size: 0.8rem; text-align: center; margin-top: 15px;">
        Need an account? <a href="{% url 'signup' %}" style="color: #5865f2;">Sign Up</a>
    </p>
</div>
